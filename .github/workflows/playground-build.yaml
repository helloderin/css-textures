name: "Playground Build"

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16
      - name: Install Dependencies
        run: npm ci
      - name: Build repo
        run: npm run build
      - name: Build playground
        run: npm run build -w apps/playground
