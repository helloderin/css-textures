name: "Package Build and Test"

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build-and-test:
    name: "Build and Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.16
      - name: Install Dependencies
        run: npm ci
      - name: Build repo
        run: npm run build
      - name: Run tests
        run: npm run test
